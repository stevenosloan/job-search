# jobscan score config. Missing keys keep the defaults in main.go;
# unknown keys are an error. Terms are case-insensitive substring matches,
# so prefer phrases that cannot appear inside unrelated words.

# Points per mission term hit (max 4 hits), and points taken off a posting
# that matches no mission term at all.
mission_weight: 8
no_mission_penalty: 25

senior_terms:
  - "senior"
  - "sr."
  - "sr "
  - "staff"
  - "principal"
  - "lead"

mission_terms:
  # Land, conservation, agriculture (top interest)
  - "land management"
  - "land use"
  - "public lands"
  - "rangeland"
  - "farmland"
  - "conservation"
